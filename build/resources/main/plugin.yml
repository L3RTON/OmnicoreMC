name: Omnicore
version: '0.1.0'
main: me.spigot.Omnicore.Omnicore
api-version: '1.21.4'
depend: [ ProtocolLib ]
commands:
  vanish:
    description: "Rende il player invisibile."
    usage: /vanish <PlayerName>
    permission: op
  tpa:
    description: "Puoi richiedere un tp."
    usage: /tpa <PlayerName>
    permission: op
  tpaccept:
    description: "Accetta la richiesta di tp."
    usage: /tpaccept
    permission: op
  tpdeny:
    description: "Rifiuta la richiesta di tp."
    usage: /tpdeny
    permission: op
