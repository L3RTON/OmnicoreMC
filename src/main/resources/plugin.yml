name: Omnicore
version: '0.2.2'
main: me.spigot.Omnicore.Omnicore
api-version: '1.21.11'
commands:
  vanish:
    description: "Rende il player invisibile."
    usage: /vanish [PlayerName]
  omnihelp:
    description: "Mostra i comandi del plugin."
    usage: /omnihelp
  fly:
    description: "Permette al player di volare in survival."
    usage: /fly [PlayerName]
  god:
    description: "Permette al player di diventare immuni al danno."
    usage: /god [PlayerName]
  heal:
    description: "Permette al player di ripristinare la salute e la fame."
    usage: /heal [PlayerName]
  admintools:
    description: "Permette al player di aprire il menu per gli staffer."
    usage: /admintools
  ping:
    description: "Permette al player di sapere il proprio ping."
    usage: /ping
  invsee:
    description: "Permette al player di visualizzare l'inventario di un giocatore."
    usage: /invsee <PlayerName>
  hat:
    description: "Permette al player di mettere un item come cappello."
    usage: /hat
  staffchat [/sc]:
    description: "Permette al player di comunicare in chat staff."
    usage: /staffchat <Message>
    aliases: [ sc ]
  dice:
    description: "Lancia un dado e sceglie un numero da 1 a 100."
    usage: /dice
  jail:
    description: "Mette il player in stato di jail."
    usage: /jail <PlayerName> <Time>
  unjail:
    description: "Fa uscire il player dallo stato di jail."
    usage: /unjail <PlayerName>
  report:
    description: "Invia un report agli staffer in game."
    usage: /report <Message>
  reportsview:
    description: "Lo staffer può vedere lo storico dei report."
    usage: /reportsview
  reportsclear:
    description: "Cancella i reports dallo storico dei report."
    usage: /reportsclear
  rocket:
    description: "Fa diventare il giocatore una cavia della Nasa."
    usage: /rocket <PlayerName>
  warn:
    description: "Warna il player con la motivazione definita"
    usage: /warn <PlayerName> <Motivation>
  unwarn:
    description: "Toglie tutti gli warn al player"
    usage: /unwarn <PlayerName>
  warnings:
    description: "Mostra i warn del player"
    usage: /warnings <PlayerName>
  permissions:
    omnicore.vanish:
      description: "Permette al player di usare il comando /vanish"
      default: op
    omnicore.fly:
      description: "Permette al player di usare il comando /fly"
      default: op
    omnicore.help:
      description: "Permette ai player di usare il comando /omnihelp"
      default: op
    omnicore.god:
      description: "Permette al player di usare il comando /god"
      default: op
    omnicore.heal:
      description: "Permette al player di usare il comando /heal"
      default: op
    omnicore.menu:
      description: "Permette al player di usare il comando /menu"
      default: op
    omnicore.invsee:
      description: "Permette al player di usare il comando /invsee"
      default: op
    omnicore.staffchat:
      description: "Permette al player di usare il comando /staffchat"
      default: op
    omnicore.jail:
      description: "Permette al player di usare il comando /jail"
      default: op
    omnicore.reports.receive:
      description: "Permette al player di vedere i reports in arrivo"
    omnicore.reports.view:
      description: "Permette allo staffer di usare il comando /viewreports"
      default: op
    omnicore.reports.clear:
      description: "Permette allo staffer di cancellare lo storico dei report"
      default: op
    omnicore.rocket:
      description: "Permette al player di usare il comando /rocket"
      default: op
    omnicore.warn:
      description: "Permette al player di usare il comando /warn"
      default: op
    omnicore.unwarn:
      description: "Permette al player di usare il comando /unwarn"
      default: op
    omnicore.maintenance:
      description: "Permette al player di entrare nel server durante la manutenzione"
      default: op

